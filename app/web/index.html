<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team — group chat with AI personas</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <!-- team-app: SPA shell mount marker (asserted by the serve test). -->
    <div id="app">
      <div class="health-banner" id="health-banner"></div>

      <aside class="sidebar">
        <div class="brand">
          <h1>Team</h1>
          <span class="tag">persona console</span>
        </div>

        <div class="sidebar-section" style="flex: 1">
          <div class="section-head">
            <span>Rooms</span>
            <button class="btn tiny ghost" id="new-room-btn" title="New room">
              +
            </button>
          </div>
          <div id="room-list"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-head">
            <span>Settings</span>
          </div>
          <div class="room-item" id="open-personas">⚙ Personas</div>
          <div class="room-item" id="open-authors">✎ Authors</div>
        </div>
      </aside>

      <main class="main">
        <header class="room-header" id="room-header"></header>
        <div class="transcript" id="transcript"></div>
        <div class="composer" id="composer"></div>
      </main>
    </div>

    <div class="overlay" id="overlay">
      <div class="modal" id="modal"></div>
    </div>
    <div class="toast-wrap" id="toasts"></div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
