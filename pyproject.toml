[project]
name = "team"
version = "0.1.0"
description = "Local group chat with AI personas backed by Claude/Codex CLI harnesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",          # FastAPI TestClient / async client
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Real-CLI smoke tests are opt-in: deselected by default so `pytest` spends no
# tokens / spawns no real claude|codex. Run them explicitly with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: spawns the REAL claude/codex CLI (spends tokens). Deselected by default; run with `pytest -m live`.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
